services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: verbas
      POSTGRES_USER: verbas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD e obrigatoria no .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dados-verbas:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verbas -d verbas"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    profiles: ["app"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/verbas
      DB_USERNAME: verbas
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD e obrigatoria no .env}
      SERVER_ADDRESS: 0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-verbas:
